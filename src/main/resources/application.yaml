server:
  port: 8080

spring:
  application:
    name: musa-spa-api
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:musa}
    username: ${DB_USER:root}
    password: ${DB_PASS:verysecret}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

# Swagger / OpenAPI Configuration
springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operationsSorter: method
    tagsSorter: alpha
    tryItOutEnabled: true
  show-actuator: false

evolution:
  api:
    url: http://localhost:8081
    key: SuaChaveSecreta123
  instance:
    name: "musa spa"

webhook:
  # Use o IP do host Docker (172.17.0.1) pois a Evolution API roda em container
  base-url: http://172.17.0.1:8080

# Logging Configuration
logging:
  level:
    spa.musa: DEBUG
    root: INFO